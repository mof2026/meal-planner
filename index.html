<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MEAL PLANNER</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MEAL PLANNER">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root {
  --bg: #FFFFFF;
  --bg-soft: #F6F7F9;
  --line: #E3E6EA;
  --text: #1F2328;
  --text-mid: #6B7280;
  --text-faint: #9AA1A9;
  --accent: #185FA5;
  --accent-soft: #E6F1FB;
  --warn: #993C1D;
  --font: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font);
  font-weight: 300;
  color: var(--text);
  background: var(--bg);
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}

button { font-family: var(--font); cursor: pointer; }
input, select, textarea { font-family: var(--font); }

/* ===== Header ===== */
.hd { padding: 20px 24px 12px; display: flex; justify-content: space-between; align-items: baseline; }
.hd h1 { font-size: 14px; font-weight: 400; color: var(--text-mid); letter-spacing: .12em; }
.hd-a { display: flex; gap: 18px; }
.hd-a button { background: none; border: none; color: var(--text-mid); font-size: 13px; padding: 0; }
.hd-a button .cnt { color: var(--accent); font-size: 11px; margin-left: 2px; }

/* ===== Week strip ===== */
.week { display: flex; align-items: stretch; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.wk-nav { background: none; border: none; color: var(--text-faint); font-size: 16px; padding: 0 14px; }
.wk-nav:active { color: var(--text); }
.wk-days { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); }
.wk-d { border-left: 1px solid var(--line); padding: 8px 8px 6px; min-width: 0; cursor: pointer; background: none; border-top: none; border-bottom: none; border-right: none; text-align: left; }
.wk-d .wd { font-size: 11px; color: var(--text-faint); letter-spacing: .06em; }
.wk-d .wd .tdy { color: var(--accent); margin-left: 3px; font-size: 9px; }
.wk-d .wm { font-size: 12px; font-weight: 400; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wk-d .wm.empty { color: var(--text-faint); font-weight: 300; }
.wk-d.sel { background: var(--bg-soft); box-shadow: inset 0 -2px 0 var(--accent); }
.wk-d.done .wm { color: var(--text-faint); }
.wk-d.done .wd::after { content: ' ✓'; color: var(--text-faint); font-size: 9px; }

/* ===== Pantry bar ===== */
.pan-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 8px 24px; border-bottom: 1px solid var(--line); }
.pan-lb { font-size: 11px; color: var(--text-faint); letter-spacing: .12em; margin-right: 4px; }
#pantry-chips { display: contents; }
.pan-chip {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; line-height: 1; padding: 4px 6px 4px 11px; border-radius: 999px;
  border: 1px solid var(--line); color: var(--text); cursor: pointer; white-space: nowrap;
}
.pan-chip.partial { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.pan-chip .px { font-size: 11px; color: var(--text-faint); padding: 0 4px; }
.pan-bar input {
  border: none; outline: none; background: transparent;
  font-size: 12px; font-weight: 300; color: var(--text); width: 150px; padding: 4px 0;
}
.pan-bar input::placeholder { color: var(--text-faint); }
#pantry-sugg { display: contents; }
.pan-ghost {
  display: inline-flex; align-items: center;
  font-size: 12px; line-height: 1; padding: 4px 11px; border-radius: 999px;
  border: 1px dashed var(--line); color: var(--text-faint);
  background: none; cursor: pointer; white-space: nowrap;
}
.pan-ghost:active { color: var(--text); border-color: var(--text-faint); }

/* ===== Main layout ===== */
.main { display: flex; flex-wrap: wrap; align-items: flex-start; }
.day { flex: 3 1 380px; padding: 20px 24px 60px; min-width: 0; }
.cand { flex: 2 1 300px; border-left: 1px solid var(--line); padding: 20px 24px 60px; min-width: 0; }

/* ===== Day view ===== */
.dv-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--text); padding-bottom: 8px; }
.dv-date { font-size: 18px; font-weight: 400; letter-spacing: .04em; }
.dv-rule-wrap { position: relative; display: inline-flex; align-self: center; }
.dv-rule-chip {
  display: inline-flex; align-items: center;
  font-size: 12px; line-height: 1; padding: 4px 12px; border-radius: 999px;
  color: #37352F; background: #E3E2E0; white-space: nowrap;
}
.dv-rule-wrap select {
  position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0;
  border: none; -webkit-appearance: none; appearance: none; cursor: pointer;
}
.dv-rule-wrap select:disabled { pointer-events: none; }
.dv-spacer { flex: 1; }
.dv-confirm { background: none; border: 1px solid var(--line); border-radius: 999px; font-size: 11px; color: var(--text-mid); padding: 2px 12px; }
.dv-confirm.on { color: var(--accent); border-color: var(--accent); }

.sec-lb { font-size: 11px; color: var(--text-faint); letter-spacing: .2em; margin: 18px 0 2px; }
.dv-main-name { font-size: 17px; font-weight: 400; line-height: 1.5; }
.dv-ing { font-size: 13px; color: var(--text-mid); white-space: pre-wrap; line-height: 1.7; margin-top: 2px; }
.dv-ref { font-size: 11px; color: var(--text-faint); margin-top: 2px; }
.dv-acts { display: flex; gap: 14px; margin-top: 6px; }
.dv-acts button { background: none; border: none; font-size: 11px; color: var(--text-faint); padding: 0; }
.dv-acts button:active { color: var(--text); }
.dv-empty { font-size: 13px; color: var(--text-faint); padding: 4px 0; }

.pan-hint { margin-top: 8px; border-top: 1px dashed var(--line); padding-top: 6px; }
.pan-hint-row { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text-mid); padding: 2px 0; flex-wrap: wrap; }
.pan-hint-row .pn { color: var(--accent); }
.pan-hint-row button { background: none; border: 1px solid var(--line); border-radius: 999px; font-size: 10px; color: var(--text-mid); padding: 1px 10px; }

.slot { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); padding: 6px 0; }
.slot-role { font-size: 11px; color: var(--text-faint); white-space: nowrap; width: 32px; }
.combo { position: relative; flex: 1; min-width: 0; }
.combo input {
  width: 100%; border: none; outline: none; background: transparent;
  font-size: 14px; font-weight: 300; color: var(--text); padding: 2px 0;
}
.combo input::placeholder { color: var(--text-faint); }
.combo-dd {
  display: none; position: absolute; left: 0; right: 0; top: 100%; z-index: 50;
  background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
  max-height: 240px; overflow-y: auto; box-shadow: 0 4px 16px rgba(31,35,40,.08);
}
.combo-dd.open { display: block; }
.combo-it { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; padding: 7px 12px; font-size: 13px; cursor: pointer; border-bottom: 1px solid var(--bg-soft); }
.combo-it:active { background: var(--bg-soft); }
.combo-it .bdg { font-size: 10px; color: var(--accent); white-space: nowrap; }
.combo-it .bdg.plain { color: var(--text-faint); }
.slot-x { background: none; border: none; color: var(--text-faint); font-size: 13px; padding: 0 2px; }
.dv-side-info {
  display: flex; gap: 12px; flex-wrap: wrap;
  font-size: 11px; color: var(--text-faint); line-height: 1.6; padding: 2px 0 4px calc(32px + 10px); /* .slot-roleの幅 + .slotのgap */
}
.dv-side-info .ref { white-space: nowrap; }
.slot-add { display: flex; gap: 16px; margin-top: 8px; }
.slot-add button { background: none; border: none; font-size: 12px; color: var(--text-mid); padding: 0; }
.slot-add button::before { content: '＋ '; color: var(--text-faint); }

.dv-line-input {
  width: 100%; border: none; border-bottom: 1px solid var(--line); outline: none;
  background: transparent; font-size: 13px; font-weight: 300; color: var(--text); padding: 4px 0;
}
.dv-line-input::placeholder { color: var(--text-faint); }
.memo-send { background: none; border: none; font-size: 11px; color: var(--text-faint); padding: 0; margin-top: 2px; }

.dv-bf select {
  font-size: 13px; font-weight: 300; color: var(--text);
  background: transparent; border: none; border-bottom: 1px solid var(--line);
  -webkit-appearance: none; appearance: none; padding: 4px 0; width: 100%; max-width: 320px; outline: none;
}

.dv-done-note { font-size: 12px; color: var(--text-faint); margin-top: 16px; }

/* ===== Candidates panel ===== */
.cp-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--text); padding-bottom: 8px; }
.cp-title { font-size: 13px; font-weight: 400; letter-spacing: .08em; color: var(--text); }
.cp-sub { font-size: 11px; color: var(--text-faint); }
.cp-switch { background: none; border: none; font-size: 11px; color: var(--accent); padding: 0; }
.cp-empty { font-size: 12px; color: var(--text-faint); padding: 16px 0; }

.cd { border-bottom: 1px solid var(--line); padding: 12px 0; cursor: pointer; }
.cd:active { background: var(--bg-soft); }
.cd-top { display: flex; align-items: baseline; gap: 8px; }
.cd-name { font-size: 15px; font-weight: 400; color: var(--text); flex: 1; min-width: 0; line-height: 1.5; }
.cd-cat { font-size: 10px; color: var(--text-faint); white-space: nowrap; }
.cd-why { font-size: 11px; color: var(--accent); line-height: 1.6; }
.cd-why .neg { color: var(--text-faint); }
.cd-ing { font-size: 12px; color: var(--text-mid); white-space: pre-wrap; line-height: 1.6; margin-top: 2px; }
.cd-skip { background: none; border: none; font-size: 11px; color: var(--text-faint); padding: 0 2px; white-space: nowrap; }

.cp-more { background: none; border: none; font-size: 12px; color: var(--text-mid); padding: 10px 0 0; }
.cp-search {
  width: 100%; border: none; border-bottom: 1px solid var(--line); outline: none;
  background: transparent; font-size: 13px; font-weight: 300; color: var(--text);
  padding: 6px 0; margin-top: 4px;
}
.cp-search::placeholder { color: var(--text-faint); }
.cl { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; width: 100%; background: none; border: none; border-bottom: 1px solid var(--bg-soft); padding: 7px 0; text-align: left; }
.cl:active { background: var(--bg-soft); }
.cl .n { font-size: 13px; color: var(--text); min-width: 0; }
.cl .w { font-size: 10px; color: var(--accent); white-space: nowrap; }
.cl .w.plain { color: var(--text-faint); }

.cp-tabs { display: flex; gap: 6px; margin: 10px 0; }
.cp-tab {
  font-size: 12px; color: var(--text-mid); background: var(--bg-soft);
  border: 1px solid var(--line); border-radius: 12px; padding: 4px 12px;
}
.cp-tab.sel { color: #fff; background: var(--accent); border-color: var(--accent); }
.cp-tab:active { opacity: .8; }

/* ===== Modals ===== */
.overlay { display: none; position: fixed; inset: 0; background: rgba(31,35,40,.25); z-index: 100; }
.overlay.open { display: flex; align-items: flex-end; }
.modal {
  background: var(--bg); width: 100%; max-height: 88vh;
  border-radius: 14px 14px 0 0; overflow-y: auto; padding: 24px; -webkit-overflow-scrolling: touch;
}
.modal-title { font-size: 13px; font-weight: 400; color: var(--text-mid); letter-spacing: .08em; margin-bottom: 14px; }
.modal-close { float: right; background: none; border: none; font-size: 16px; color: var(--text-faint); }
.m-sec { margin-bottom: 26px; }
.m-lb { font-size: 11px; color: var(--text-faint); letter-spacing: .1em; margin-bottom: 8px; }

.pt-add { display: flex; gap: 10px; margin-top: 10px; align-items: center; }
.pt-add input {
  flex: 1; border: none; border-bottom: 1px solid var(--line); outline: none;
  background: transparent; font-size: 13px; font-weight: 300; padding: 4px 0;
}
.pt-add button { background: none; border: none; font-size: 12px; color: var(--accent); padding: 0; white-space: nowrap; }

.mm-row { display: flex; align-items: baseline; gap: 10px; border-bottom: 1px solid var(--line); padding: 7px 0; }
.mm-chk { background: none; border: 1px solid var(--line); border-radius: 4px; width: 18px; height: 18px; flex-shrink: 0; align-self: center; font-size: 11px; color: var(--accent); line-height: 1; }
.mm-body { flex: 1; min-width: 0; }
.mm-text { font-size: 13px; }
.mm-text.done { color: var(--text-faint); text-decoration: line-through; }
.mm-edit {
  width: 100%; border: none; border-bottom: 1px solid var(--accent); outline: none;
  background: transparent; font-size: 13px; font-weight: 300; color: var(--text); padding: 2px 0;
}
.mm-meta { font-size: 10px; color: var(--text-faint); }
.mm-x { background: none; border: none; color: var(--text-faint); font-size: 13px; }
.mm-add { display: flex; gap: 10px; margin-top: 10px; }
.mm-add input {
  flex: 1; border: none; border-bottom: 1px solid var(--line); outline: none;
  background: transparent; font-size: 13px; font-weight: 300; padding: 4px 0;
}
.mm-add button { background: none; border: none; font-size: 12px; color: var(--accent); padding: 0; white-space: nowrap; }
.mm-copy { background: none; border: 1px solid var(--line); border-radius: 999px; font-size: 11px; color: var(--text-mid); padding: 2px 14px; margin-top: 14px; }

.rg { display: grid; grid-template-columns: 28px 1fr; gap: 10px 14px; align-items: center; }
.rg .rl { font-size: 12px; color: var(--text-faint); }
.rg .dv-rule-wrap { justify-self: start; }
.lnk { background: none; border: none; font-size: 11px; color: var(--text-faint); text-decoration: underline; text-underline-offset: 2px; padding: 0; margin-top: 10px; }

.bp-item { border-bottom: 1px solid var(--line); }
.bp-view { display: flex; align-items: flex-start; gap: 8px; padding: 8px 0; cursor: pointer; }
.bp-view-text { flex: 1; min-width: 0; }
.bp-view-name { font-size: 13px; }
.bp-view-ing { font-size: 12px; color: var(--text-mid); margin-top: 2px; }
.bp-x { background: none; border: none; color: var(--text-faint); font-size: 12px; padding: 2px 4px; flex-shrink: 0; }
.bp-edit { display: flex; flex-direction: column; gap: 2px; padding: 8px 0 10px; }
.bp-edit textarea, .bp-add textarea {
  width: 100%; border: none; border-bottom: 1px solid var(--line); outline: none;
  background: transparent; font-weight: 300; color: var(--text); font-family: inherit;
  padding: 4px 0; resize: none; overflow: hidden; line-height: 1.5;
}
.bp-edit .b-n, .bp-add .b-n { font-size: 13px; }
.bp-edit .b-i, .bp-add .b-i { font-size: 12px; color: var(--text-mid); }
.bp-done { background: none; border: none; font-size: 11px; color: var(--accent); padding: 4px 0 0; align-self: flex-end; }
.bp-add { display: flex; flex-direction: column; gap: 2px; margin-top: 10px; }
.bp-add button { background: none; border: none; font-size: 12px; color: var(--accent); padding: 6px 0 0; align-self: flex-start; white-space: nowrap; }

.csv-d { border: 1px dashed var(--line); border-radius: 8px; padding: 16px; text-align: center; color: var(--text-mid); font-size: 12px; cursor: pointer; }
.csv-d input { display: none; }
.csv-loaded { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-mid); }
.csv-loaded .lnk { margin-top: 0; }

.bk-row { display: flex; gap: 16px; }
.bk-row button { background: none; border: 1px solid var(--line); border-radius: 999px; font-size: 11px; color: var(--text-mid); padding: 2px 14px; }

@media (min-width: 768px) {
  .modal { max-width: 560px; margin: 0 auto; border-radius: 14px; }
  .overlay.open { align-items: center; justify-content: center; }
}
@media (max-width: 720px) {
  .cand { border-left: none; border-top: 1px solid var(--line); }
  .wk-d .wm { font-size: 11px; }
}
@media (min-width: 1000px) {
  .dv-date { font-size: 20px; }
  .dv-main-name { font-size: 19px; }
  .dv-ing { font-size: 14px; }
  .combo input { font-size: 15px; }
  .cd-name { font-size: 15px; }
  .cd-why { font-size: 12px; }
  .wk-d .wm { font-size: 13px; }
  .wk-d .wd { font-size: 12px; }
}
</style>
</head>
<body>

<div class="hd">
  <h1>MEAL PLANNER</h1>
  <div class="hd-a">
    <button onclick="openModal('memo')">Notionメモ<span class="cnt" id="memo-count"></span></button>
    <button onclick="openModal('settings')">設定</button>
  </div>
</div>

<nav class="week">
  <button class="wk-nav" onclick="moveWeek(-1)">‹</button>
  <div class="wk-days" id="week-strip"></div>
  <button class="wk-nav" onclick="moveWeek(1)">›</button>
</nav>

<div class="pan-bar">
  <span class="pan-lb">在庫</span>
  <span id="pantry-chips"></span>
  <input type="text" id="pantry-inline" placeholder="＋使い切りたい食材…"
         onkeydown="if(event.key==='Enter')addPantryInline()">
  <span id="pantry-sugg"></span>
</div>

<main class="main">
  <section class="day" id="day-view"></section>
  <aside class="cand" id="cand-panel"></aside>
</main>

<div class="overlay" id="ov-memo" onclick="closeModal(event,'memo')">
  <div class="modal" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="closeModal(null,'memo')">✕</button>
    <div class="modal-title">Notionに反映したいことメモ</div>
    <div id="memo-list"></div>
    <div class="mm-add">
      <input type="text" id="memo-input" placeholder="メモ…" onkeydown="if(event.key==='Enter')addMemo()">
      <button onclick="addMemo()">追加</button>
    </div>
    <button class="mm-copy" onclick="copyMemos()">未処理メモをコピー</button>
  </div>
</div>

<div class="overlay" id="ov-settings" onclick="closeModal(event,'settings')">
  <div class="modal" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="closeModal(null,'settings')">✕</button>
    <div class="modal-title">設定</div>

    <div class="m-sec">
      <div class="m-lb">バックアップ（全データ）</div>
      <div class="bk-row">
        <button onclick="exportBackup()">書き出し</button>
        <button onclick="document.getElementById('backup-file').click()">読み込み</button>
        <input type="file" id="backup-file" accept=".json" style="display:none">
      </div>
    </div>

    <div class="m-sec">
      <div class="m-lb">レシピCSV</div>
      <div class="csv-d" id="csv-drop" onclick="document.getElementById('csv-file').click()">
        タップしてCSVを選択
        <input type="file" id="csv-file" accept=".csv">
      </div>
      <div class="csv-loaded" id="csv-loaded" style="display:none">
        <span id="csv-status"></span>
        <button class="lnk" onclick="document.getElementById('csv-file').click()">CSVを読み込み直す</button>
      </div>
    </div>

    <div class="m-sec">
      <div class="m-lb">朝食パターン（タップで編集）</div>
      <div id="bp-list"></div>
      <div class="bp-add">
        <textarea id="bp-name-input" class="b-n" rows="1" placeholder="メニュー名…"
                  oninput="autoGrow(this)"
                  onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}"></textarea>
        <textarea id="bp-ing-input" class="b-i" rows="1" placeholder="材料（任意）…"
                  oninput="autoGrow(this)"
                  onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}"></textarea>
        <button onclick="addBreakfastPattern()">＋ 追加</button>
      </div>
    </div>

    <div class="m-sec">
      <div class="m-lb">曜日ルール</div>
      <div class="rg" id="rules-grid"></div>
      <button class="lnk" onclick="resetRules()">デフォルトに戻す</button>
    </div>
  </div>
</div>

<script>
'use strict';

/* ============================================================
   VERSION
   ============================================================ */

/* localStorageが使えない環境（サンドボックス内プレビュー等）ではメモリ保存で動かす */
const LS = (() => {
  try {
    const t = globalThis.localStorage;
    t.setItem('mp2_ping', '1');
    t.removeItem('mp2_ping');
    return t;
  } catch {
    const mem = {};
    return {
      _memory: true,
      getItem: k => Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : null,
      setItem: (k, v) => { mem[k] = String(v); },
      removeItem: k => { delete mem[k]; },
      key: i => Object.keys(mem)[i] || null,
      get length() { return Object.keys(mem).length; }
    };
  }
})();

const APP_VERSION = '1';
if (LS.getItem('mp2_version') !== APP_VERSION) {
  const stale = [];
  for (let i = 0; i < LS.length; i++) {
    const k = LS.key(i);
    if (k && k.startsWith('mp2_')) stale.push(k);
  }
  stale.forEach(k => LS.removeItem(k));
  LS.setItem('mp2_version', APP_VERSION);
}

/* ============================================================
   STORAGE
   ============================================================ */

const Storage = {
  get(key) {
    try {
      const raw = LS.getItem('mp2_' + key);
      return raw ? JSON.parse(raw) : null;
    } catch { return null; }
  },
  _saveWarned: false,
  set(key, value) {
    try {
      LS.setItem('mp2_' + key, JSON.stringify(value));
    } catch (e) {
      console.warn('storage save failed:', key, e);
      if (!this._saveWarned) {
        this._saveWarned = true;
        alert('データの保存に失敗しました。ストレージの容量が不足している可能性があります。');
      }
    }
  }
};

/* ============================================================
   CSV
   ============================================================ */

function parseCSV(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');

  const rows = [];
  let pos = 0;
  const len = text.length;

  while (pos < len) {
    const row = [];
    while (pos < len) {
      let value = '';
      if (text[pos] === '"') {
        pos++;
        while (pos < len) {
          if (text[pos] === '"') {
            if (pos + 1 < len && text[pos + 1] === '"') { value += '"'; pos += 2; }
            else { pos++; break; }
          } else { value += text[pos]; pos++; }
        }
        if (pos < len && text[pos] === ',') { pos++; }
        else if (pos < len && text[pos] === '\n') { pos++; row.push(value); break; }
        else { row.push(value); break; }
      } else {
        const nextComma = text.indexOf(',', pos);
        const nextNewline = text.indexOf('\n', pos);
        const end = (nextComma === -1 && nextNewline === -1) ? len
          : (nextComma === -1) ? nextNewline
          : (nextNewline === -1) ? nextComma
          : Math.min(nextComma, nextNewline);
        value = text.substring(pos, end);
        pos = end;
        if (pos < len && text[pos] === ',') { pos++; }
        else if (pos < len && text[pos] === '\n') { pos++; row.push(value); break; }
        else { row.push(value); break; }
      }
      row.push(value);
    }
    if (row.length > 0 && !(row.length === 1 && row[0] === '')) rows.push(row);
  }

  if (rows.length < 2) return [];
  const headers = rows[0].map(h => h.trim());
  return rows.slice(1).map(row => {
    const obj = {};
    headers.forEach((h, j) => { obj[h] = (row[j] || '').trim(); });
    return obj;
  });
}

const KEY_INGREDIENTS = [
  '鮭','鯖','さば','ぶり','鰤','たら','鱈','鯛','さわら','あじ','かつお','まぐろ',
  '鶏','とり','チキン','豚','ぶた','牛','ビーフ',
  '豆腐','厚揚げ','生揚げ','えび','エビ','海老','いか','イカ',
  'ハンバーグ','ツナ','しらす','サーモン','めかじき','かじき',
  'さんま','いわし','ほたて','あさり','合いびき','合挽き','ひき肉'
];

function extractKeyIngredients(text) {
  return KEY_INGREDIENTS.filter(k => text.includes(k));
}

function splitList(str) {
  const out = [];
  let buf = '', depth = 0;
  for (const ch of String(str || '')) {
    if (ch === '（' || ch === '(') depth++;
    else if (ch === '）' || ch === ')') depth = Math.max(0, depth - 1);
    if (depth === 0 && (ch === ',' || ch === '、' || ch === '，')) { out.push(buf); buf = ''; }
    else buf += ch;
  }
  out.push(buf);
  return out.map(s => s.trim()).filter(Boolean);
}

function parenDepth(s) {
  let d = 0;
  for (const ch of String(s)) {
    if (ch === '（' || ch === '(') d++;
    else if (ch === '）' || ch === ')') d = Math.max(0, d - 1);
  }
  return d;
}

/** 旧バージョンが括弧内で誤分割したリストを繋ぎ直す（保存済みデータの自動修復用） */
function repairSplitList(arr) {
  const out = [];
  for (const item of arr) {
    if (out.length && parenDepth(out[out.length - 1]) > 0) {
      out[out.length - 1] += '、' + item;
    } else {
      out.push(item);
    }
  }
  return out;
}

/** Notion CSV → recipe objects. 「役割」列の有無で新旧フォーマットを判別する。 */
function csvToRecipes(parsed) {
  if (!parsed.length) return [];
  const isNew = '役割' in parsed[0];

  return parsed.map((row, idx) => {
    const name = row['名前'] || '';
    if (isNew) {
      const ingredients = row['材料と分量'] || row['主な材料'] || '';
      let keys = splitList(row['主要食材']);
      if (!keys.length) keys = extractKeyIngredients(name + ' ' + ingredients);
      return {
        id: idx,
        name,
        role: row['役割'] || '主菜',
        category: row['カテゴリ'] || '',
        tags: splitList(row['タグ']),
        keyIngredients: keys,
        ingredients,
        pairings: splitList(row['合う副菜']),
        substitutes: splitList(row['代用食材'] || ''),
        book: row['レシピ本'] || '',
        page: row['ページ'] || '',
        hotcookKey: row['ホットクックキー'] || ''
      };
    }
    const ingredients = row['主な材料'] || '';
    return {
      id: idx,
      name,
      role: (row['カテゴリ'] === '副菜') ? '副菜' : '主菜',
      category: row['カテゴリ'] || '',
      tags: splitList(row['タグ']),
      keyIngredients: extractKeyIngredients(name + ' ' + ingredients),
      ingredients,
      pairings: [row['献立例1'], row['献立例2'], row['献立例3'], row['献立例4']]
        .filter(s => s && s.trim()).map(s => s.trim()),
      substitutes: [],
      book: row['レシピ本'] || '',
      page: row['ページ'] || '',
      hotcookKey: row['ホットクックキー'] || ''
    };
  }).filter(r => r.name);
}

const DAY_OF_WEEK = ['日', '月', '火', '水', '木', '金', '土'];

function toLocalDate(iso) {
  const p = iso.split('-').map(Number);
  return new Date(p[0], p[1] - 1, p[2]);
}
function toISOString(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}
function todayISO() { return toISOString(new Date()); }
function addDaysISO(iso, n) {
  const d = toLocalDate(iso);
  d.setDate(d.getDate() + n);
  return toISOString(d);
}
function getDayName(iso) { return DAY_OF_WEEK[toLocalDate(iso).getDay()]; }
function formatDate(iso) {
  const d = toLocalDate(iso);
  return (d.getMonth() + 1) + '月' + d.getDate() + '日';
}
function formatDateShort(iso) {
  const d = toLocalDate(iso);
  return (d.getMonth() + 1) + '/' + d.getDate();
}
function diffDays(isoA, isoB) {
  return Math.round((toLocalDate(isoA) - toLocalDate(isoB)) / 86400000);
}
function mondayOf(iso) {
  const d = toLocalDate(iso);
  const shift = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - shift);
  return toISOString(d);
}

function mainSnapshot(rec) {

/* ============================================================
   SCORING — 決定的・乱数なし。理由を文字列で返す
   ============================================================ */

/* 「玉ねぎ」と「長ねぎ・万能ねぎ・ねぎ」は別の食材。
   部分一致（共通の「ねぎ」）で互いにマッチしないようにする */
function isTamanegi(s) { return /玉ねぎ|たまねぎ|玉ネギ|新玉/.test(s); }
function isNaganegiKei(s) { return /ねぎ|ネギ/.test(s) && !isTamanegi(s); }
function ingMatch(a, b) {
  if (a === b) return true;
  if ((isTamanegi(a) && isNaganegiKei(b)) || (isNaganegiKei(a) && isTamanegi(b))) return false;
  return a.includes(b) || b.includes(a);
}

/** 在庫食材とレシピの照合種別を返す。'key'=通常の主要食材マッチ、'sub'=代用食材マッチ、null=不一致
 *  レシピ名・材料本文中の文字列一致とkeyIngredientsは'key'、substitutesのみでのマッチは'sub' */
function pantryMatchKind(rec, item) {
  const n = item.name;
  if (!n) return null;
  if (rec.name.includes(n) || rec.ingredients.includes(n) ||
      rec.keyIngredients.some(k => ingMatch(k, n))) return 'key';
  if ((rec.substitutes || []).some(s => ingMatch(s, n))) return 'sub';
  return null;
}

function recipeMatchesPantryItem(rec, item) {
  return pantryMatchKind(rec, item) !== null;
}

/** 指定日以外で、その主菜を最後に作った（=配置した）日 */
function lastMadeDate(name, excludeDate) {
  let last = null;
  const today = todayISO();
  for (const [date, day] of Object.entries(days)) {
    if (date === excludeDate) continue;
    if (!day.main || day.main.name !== name) continue;
    if (date > today && !day.confirmed) continue;
    if (!last || date > last) last = date;
  }
  return last;
}

/** 指定日より未来にいる同名主菜（過去分は直近ペナルティ側で減点済み） */
function plannedNearby(name, date, range) {
  for (let i = 1; i <= range; i++) {
    const d = addDaysISO(date, i);
    const day = days[d];
    if (day && day.main && day.main.name === name) return d;
  }
  return null;
}

function keyOverlap(keysA, keysB) {
  return keysA.filter(a => keysB.some(b => ingMatch(a, b)));
}

/** 「合う副菜」照合の共通ヘルパ：完全一致、または双方2文字以上でingMatch（1文字語は完全一致のみ） */
function pairingMatch(a, b) {
  return a === b || (a.length >= 2 && b.length >= 2 && ingMatch(a, b));
}

function scoreCandidate(rec, date, daySides) {
  let score = 0;
  const why = [];     // {text, neg}

  for (const item of pantry) {
    const kind = pantryMatchKind(rec, item);
    if (kind) {
      score += item.state === 'partial' ? 80 : 60;
      const suffix = kind === 'sub' ? 'が使える（代用）' : 'が使える';
      why.push({ text: item.name + (item.state === 'partial' ? '（残りあり）' : '') + suffix, neg: false });
    }
  }

  // 先に副菜・汁物が入力されていたら、それと相性のいい主菜を優先する（加点は1回まで）
  let paired = false;
  for (const s of daySides) {
    if (rec.pairings.some(p => pairingMatch(p, s.name))) {
      if (!paired) { score += 70; paired = true; }
      why.push({ text: s.name + 'に合う', neg: false });
    }
  }

  const today = todayISO();
  const last = lastMadeDate(rec.name, date);
  if (last) {
    const ago = diffDays(today, last);
    if (ago >= 0 && ago <= 14) {
      score -= 100;
      why.push({ text: ago === 0 ? '今日の分に予定済み' : ago + '日前に作った', neg: true });
    } else if (ago > 14) {
      score += Math.min(ago, 90) * 0.5;
      if (ago >= 21) why.push({ text: ago + '日ぶり', neg: false });
    }
  } else {
    score += 25;
  }

  const planned = plannedNearby(rec.name, date, 10);
  if (planned) {
    score -= 100;
    why.push({ text: formatDateShort(planned) + 'に予定済み', neg: true });
  }

  for (const offset of [-1, 1]) {
    const d = addDaysISO(date, offset);
    const other = days[d] && days[d].main;
    if (other && other.keyIngredients) {
      // 材料かぶりは軽い減点に留める（使い切り優先。主菜名の重複は-100で別途防止）
      const overlap = keyOverlap(rec.keyIngredients, other.keyIngredients);
      if (overlap.length) {
        score -= 10;
        why.push({ text: (offset < 0 ? '前日' : '翌日') + 'と' + overlap[0] + 'がかぶる', neg: true });
      }
    }
  }

  return { rec, score, why };
}

function mainCandidates(date) {
  const rule = ruleForDate(date);
  const pool = filterByRule(recipes, rule);
  const ex = excluded[date] || new Set();
  const daySides = days[date] ? days[date].sides.filter(s => s.name) : [];
  const scored = pool
    .filter(r => !ex.has(r.name))
    .map(r => scoreCandidate(r, date, daySides));
  scored.sort((a, b) => b.score - a.score || a.rec.name.localeCompare(b.rec.name, 'ja'));
  return scored;
}

function isSideRole(r) { return r.role === '副菜' || r.role === '汁物'; }

/** 副菜・汁物名から登録レシピを探す。「〇〇(メモ)」のような末尾括弧は1組ずつ外しながら再検索 */
function findSideRecipe(name) {
  let n = (name || '').trim();
  while (n) {
    const hit = recipes.find(r => isSideRole(r) && r.name === n);
    if (hit) return hit;
    const base = n.replace(/[（(][^（()）]*[）)]\s*$/, '').trim();
    if (base === n) return null;
    n = base;
  }
  return null;
}

/** 名前から副菜/汁物を推定（レシピ未登録の自由入力向け） */
function guessSideRole(name) {
  const rec = findRecipe(name);
  if (rec && isSideRole(rec)) return rec.role;
  return /スープ|汁|ポタージュ|チャウダー|ミネストローネ/.test(name) ? '汁物' : '副菜';
}

/** 副菜・汁物の候補。合う副菜 → 過去の組み合わせ実績 → 全リストの順
 *  role を渡すとその役割（guessSideRole基準）だけに絞る（省略時は従来どおり両方混在＝setMainの自動セット用） */
function sideSuggestions(mainName, query, role) {
  const out = [];
  const seen = new Set();
  const q = (query || '').trim();
  const push = (name, src, count) => {
    if (!name || seen.has(name)) return;
    if (q && !name.includes(q)) return;
    const r = guessSideRole(name);
    if (role && r !== role) return;
    seen.add(name);
    const badge = src === 'pairing' ? '相性◎・' + r
      : src === 'history' ? '実績' + count + '回・' + r
      : r;
    out.push({ name, role: r, badge, plain: src === 'list' });
  };

  if (mainName) {
    const rec = findRecipe(mainName);
    if (rec) rec.pairings.forEach(p => push(p, 'pairing'));

    const counts = {};
    for (const day of Object.values(days)) {
      if (!day.main || day.main.name !== mainName) continue;
      for (const s of day.sides) {
        if (s.name) counts[s.name] = (counts[s.name] || 0) + 1;
      }
    }
    Object.entries(counts).sort((a, b) => b[1] - a[1])
      .forEach(([name, n]) => push(name, 'history', n));
  }

  recipes.filter(isSideRole)
    .forEach(r => push(r.name, 'list'));
  return out;
}

/** 全dayを1回だけ走査し、主菜名→（副菜名→使用回数）のMapを作る（sideCandidatesの実績集計用）。
 *  day.mainがある日のみ対象。毎候補ごとにdays全走査していたhistoryCountを廃止するための事前集計 */
function buildSideHistoryMap() {
  const map = new Map(); // mainName -> Map(sideName -> count)
  for (const d of Object.values(days)) {
    if (!d.main) continue;
    let inner = map.get(d.main.name);
    if (!inner) { inner = new Map(); map.set(d.main.name, inner); }
    for (const s of d.sides) {
      if (!s.name) continue;
      inner.set(s.name, (inner.get(s.name) || 0) + 1);
    }
  }
  return map;
}

/** 副菜・汁物候補（強化版）。決定的スコアで並べる。role: '副菜'|'汁物'
 *  各要素: { name, rec: 登録レシピ|null, role, score, why: [{text, neg}] } */
function sideCandidates(date, role) {
  const day = getDay(date);
  const usedNames = new Set(day.sides.filter(s => s.name && s.role === role).map(s => s.name));

  const historyMap = buildSideHistoryMap();
  const mainHistory = day.main ? (historyMap.get(day.main.name) || new Map()) : new Map();

  const mainRec = day.main ? findRecipe(day.main.name) : null;
  const pairingNames = (mainRec && Array.isArray(mainRec.pairings))
    ? mainRec.pairings.filter(p => guessSideRole(p) === role) : [];

  // 候補プール作成（name → { rec, fromPairing }）
  const pool = new Map(); // name -> { rec }
  recipes.filter(r => r.role === role).forEach(r => {
    if (!pool.has(r.name)) pool.set(r.name, { rec: r });
  });

  const extra = []; // プールに無い名前（rec: null）。pairings由来 or 実績のみの未登録名
  const poolNames = [...pool.keys()];
  pairingNames.forEach(p => {
    const hit = poolNames.find(name => pairingMatch(p, name));
    if (!hit && !extra.some(e => e.name === p)) extra.push({ name: p, rec: null });
  });
  // 実績はあるがレシピ未登録・pairingsにも無い名前も候補プールに復活させる
  // （旧sideSuggestionsが出していた「実績のみの副菜」相当）
  for (const name of mainHistory.keys()) {
    if (pool.has(name)) continue;
    if (guessSideRole(name) !== role) continue;
    if (extra.some(e => e.name === name)) continue;
    extra.push({ name, rec: null });
  }

  const entries = [...[...pool.entries()].map(([name, v]) => ({ name, rec: v.rec })), ...extra]
    .filter(e => !usedNames.has(e.name));

  const out = entries.map(e => {
    let score = 0;
    const why = [];

    const isPairing = pairingNames.some(p => pairingMatch(p, e.name));
    if (isPairing) {
      score += 70;
      why.push({ text: '相性◎', neg: false });
    }

    if (day.main) {
      const n = mainHistory.get(e.name) || 0;
      if (n > 0) {
        score += Math.min(n * 10, 30);
        why.push({ text: '実績' + n + '回', neg: false });
      }
    }

    if (e.rec) {
      for (const item of pantry) {
        const kind = pantryMatchKind(e.rec, item);
        if (kind) {
          score += item.state === 'partial' ? 80 : 60;
          const suffix = kind === 'sub' ? 'が使える（代用）' : 'が使える';
          why.push({ text: item.name + (item.state === 'partial' ? '（残りあり）' : '') + suffix, neg: false });
        }
      }
    }

    return { name: e.name, rec: e.rec, role, score, why };
  });

  out.sort((a, b) => b.score - a.score || a.name.localeCompare(b.name, 'ja'));
  return out;
}

/* ============================================================
   HELPERS
   ============================================================ */

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

/* ============================================================
   WEEK STRIP
   ============================================================ */

function renderStrip() {
  const strip = document.getElementById('week-strip');
  strip.innerHTML = '';
  const today = todayISO();
  for (let i = 0; i < 7; i++) {
    const date = addDaysISO(weekStart, i);
    const day = days[date];
    const btn = el('button', 'wk-d');
    if (date === selectedDate) btn.classList.add('sel');
    if (day && day.confirmed) btn.classList.add('done');

    const wd = el('div', 'wd', getDayName(date) + ' ' + formatDateShort(date));
    if (date === today) wd.appendChild(el('span', 'tdy', '今日'));
    btn.appendChild(wd);

    const mainName = day && day.main ? day.main.name : '';
    const wm = el('div', 'wm' + (mainName ? '' : ' empty'), mainName || '—');
    btn.appendChild(wm);

    btn.addEventListener('click', () => selectDay(date));
    strip.appendChild(btn);
  }
}

function selectDay(date) {
  selectedDate = date;
  weekStart = mondayOf(date);
  resetPanelState(!getDay(date).main);
  renderAll();
}

function moveWeek(n) {
  weekStart = addDaysISO(weekStart, n * 7);
  selectedDate = weekStart;
  resetPanelState(!getDay(selectedDate).main);
  renderAll();
}

/* ============================================================
   DAY VIEW
   ============================================================ */

function renderDay() {
  const view = document.getElementById('day-view');
  view.innerHTML = '';
  const date = selectedDate;
  const day = getDay(date);

  // --- ヘッダ：日付・ルールチップ・確定 ---
  const head = el('div', 'dv-head');
  head.appendChild(el('span', 'dv-date', formatDate(date) + '（' + getDayName(date) + '）'));

  const ruleSel = document.createElement('select');
  const defRule = getRules()[getDayName(date)] || DEFAULT_RULES[getDayName(date)];
  const defOpt = el('option', null, ruleLabel(defRule) + (day.ruleOverride ? '（既定）' : ''));
  defOpt.value = '';
  if (!day.ruleOverride) defOpt.selected = true;
  ruleSel.appendChild(defOpt);
  RULE_OPTIONS.forEach(opt => {
    if (!day.ruleOverride && opt.type === defRule.type && opt.value === defRule.value) return;
    const o = el('option', null, opt.label);
    o.value = JSON.stringify({ type: opt.type, value: opt.value });
    if (day.ruleOverride && day.ruleOverride.type === opt.type && day.ruleOverride.value === opt.value) o.selected = true;
    ruleSel.appendChild(o);
  });
  ruleSel.disabled = day.confirmed;
  ruleSel.addEventListener('change', () => {
    const d = touchDay(date);
    d.ruleOverride = ruleSel.value ? JSON.parse(ruleSel.value) : null;
    saveDays();
    panelShowAll = false;
    renderAll();
  });
  const effRule = day.ruleOverride || defRule;
  const ruleWrap = el('div', 'dv-rule-wrap');
  const chip = el('span', 'dv-rule-chip', ruleLabel(effRule));
  chip.style.background = ruleChipColor(effRule);
  ruleWrap.appendChild(chip);
  ruleWrap.appendChild(ruleSel);
  head.appendChild(ruleWrap);

  head.appendChild(el('span', 'dv-spacer'));

  const confirmBtn = el('button', 'dv-confirm' + (day.confirmed ? ' on' : ''),
    day.confirmed ? '✓ 確定済み（編集に戻す）' : '確定する');
  confirmBtn.addEventListener('click', () => {
    const d = touchDay(date);
    d.confirmed = !d.confirmed;
    saveDays();
    resetPanelState(!getDay(date).main);
    renderAll();
  });
  head.appendChild(confirmBtn);
  view.appendChild(head);

  const locked = day.confirmed;

  // --- 主菜 ---
  view.appendChild(el('div', 'sec-lb', '主菜'));
  if (day.main) {
    view.appendChild(el('div', 'dv-main-name', day.main.name));
    if (day.main.ingredients) view.appendChild(el('div', 'dv-ing', day.main.ingredients));
    if (day.main.substitutes && day.main.substitutes.length) {
      view.appendChild(el('div', 'dv-ref', '代用OK: ' + day.main.substitutes.join('、')));
    }
    const refParts = [];
    if (day.main.book) refParts.push(day.main.book + (day.main.page ? ' p.' + day.main.page : ''));
    if (day.main.hotcookKey) refParts.push('ホットクック: ' + day.main.hotcookKey);
    if (refParts.length) view.appendChild(el('div', 'dv-ref', refParts.join('　')));

    if (!locked) {
      const acts = el('div', 'dv-acts');
      const reBtn = el('button', null, '選び直す');
      reBtn.addEventListener('click', () => { resetPanelState(true); renderPanel(); });
      acts.appendChild(reBtn);
      const clrBtn = el('button', null, 'クリア');
      clrBtn.addEventListener('click', () => {
        touchDay(date).main = null;
        saveDays();
        resetPanelState(true);
        renderAll();
      });
      acts.appendChild(clrBtn);
      const memoBtn = el('button', null, 'Notionメモ');
      memoBtn.addEventListener('click', () => promptMemo(day.main.name));
      acts.appendChild(memoBtn);
      view.appendChild(acts);

      // 在庫マッチ → 使い切り確認
      const matched = pantry.filter(item =>
        recipeMatchesPantryItem({ name: day.main.name, ingredients: day.main.ingredients || '',
          keyIngredients: day.main.keyIngredients || [], substitutes: day.main.substitutes || [] }, item));
      if (matched.length) {
        const hint = el('div', 'pan-hint');
        matched.forEach(item => {
          const row = el('div', 'pan-hint-row');
          row.appendChild(el('span', 'pn',
            '在庫: ' + item.name + (item.state === 'partial' ? '（残りあり）' : '')));
          const useUp = el('button', null, '使い切った');
          useUp.addEventListener('click', () => {
            pantry = pantry.filter(p => p !== item);
            savePantry();
            renderAll();
          });
          row.appendChild(useUp);
          if (item.state !== 'partial') {
            const half = el('button', null, 'まだ残ってる');
            half.addEventListener('click', () => {
              item.state = 'partial';
              savePantry();
              renderAll();
            });
            row.appendChild(half);
          }
          hint.appendChild(row);
        });
        view.appendChild(hint);
      }
    }
  } else if (locked) {
    view.appendChild(el('div', 'dv-empty', '—'));
  } else {
    view.appendChild(el('div', 'dv-empty', '右の候補から選ぶか、ここに直接入力 ↓'));
    const combo = buildCombo({
      placeholder: '主菜を入力…',
      suggest: q => {
        const ex = excluded[date] || new Set();
        return recipes.filter(r => r.role === '主菜' && !ex.has(r.name))
          .filter(r => !q || r.name.includes(q))
          .slice(0, 30)
          .map(r => ({ name: r.name, badge: r.category, plain: true }));
      },
      commit: name => { if (name) setMain(date, name); }
    });
    combo.classList.add('slot');
    view.appendChild(combo);
  }

  // --- 副菜・汁物 ---
  view.appendChild(el('div', 'sec-lb', '副菜・汁物'));
  if (!day.sides.length && locked) view.appendChild(el('div', 'dv-empty', '—'));
  day.sides.forEach((side, idx) => {
    const row = el('div', 'slot');
    row.appendChild(el('span', 'slot-role', side.role));
    if (locked) {
      row.appendChild(el('span', null, side.name || '—'));
    } else {
      const combo = buildCombo({
        value: side.name,
        placeholder: side.role + 'を入力…',
        suggest: q => {
          const curRole = (d0 => d0 && d0.sides[idx] ? d0.sides[idx].role : side.role)(days[date]);
          return sideSuggestions(day.main ? day.main.name : '', q, curRole).slice(0, 30);
        },
        commit: (name, item) => {
          const d = touchDay(date);
          const slot = d.sides[idx];
          if (!slot) return;
          const oldRole = slot.role;
          let changed = false;
          if (slot.name !== name) { slot.name = name; changed = true; }
          const newRole = item ? item.role : (name ? guessSideRole(name) : slot.role);
          if (name && newRole && slot.role !== newRole) { slot.role = newRole; changed = true; }
          if (changed) {
            saveDays();
            renderStrip();
            if (slot.role !== oldRole) renderDay();
            // 副菜逆引き（pairings加点）を候補パネルに反映する。
            // blur起因のcommit直後に即再描画するとパネル側へのタップを食うため150ms遅らせる（メモ欄と同方式）。
            // 連続入力中は毎回再描画すると重いのでデバウンスし、かつ候補パネル内で検索欄に入力中なら
            // 再描画するとフォーカスが飛んでしまうため見送る。
            clearTimeout(panelRerenderTimer);
            panelRerenderTimer = setTimeout(() => {
              const ae = document.activeElement;
              if (ae && ae.closest && ae.closest('#cand-panel')) return;
              renderPanel();
            }, 150);
          }
        }
      });
      row.appendChild(combo);
      const x = el('button', 'slot-x', '✕');
      x.addEventListener('click', () => {
        const d = touchDay(date);
        d.sides.splice(idx, 1);
        saveDays();
        renderAll();
      });
      row.appendChild(x);
    }
    view.appendChild(row);

    // 登録済みレシピなら材料とレシピ本を添える
    const sideRec = findSideRecipe(side.name);
    if (sideRec && (sideRec.ingredients || sideRec.book || (sideRec.substitutes && sideRec.substitutes.length))) {
      const info = el('div', 'dv-side-info');
      if (sideRec.ingredients) info.appendChild(el('span', null, sideRec.ingredients));
      if (sideRec.substitutes && sideRec.substitutes.length) {
        info.appendChild(el('span', null, '代用OK: ' + sideRec.substitutes.join('、')));
      }
      if (sideRec.book) {
        info.appendChild(el('span', 'ref',
          sideRec.book + (sideRec.page ? ' p.' + sideRec.page : '')));
      }
      view.appendChild(info);
    }
  });
  if (!locked) {
    const add = el('div', 'slot-add');
    [['副菜', '副菜を追加'], ['汁物', '汁物を追加']].forEach(([role, label]) => {
      const btn = el('button', null, label);
      btn.addEventListener('click', () => {
        const d = touchDay(date);
        d.sides.push({ role, name: '' });
        saveDays();
        renderDay();
        const inputs = document.querySelectorAll('#day-view .combo input');
        if (inputs.length) inputs[inputs.length - 1].focus();
      });
      add.appendChild(btn);
    });
    view.appendChild(add);
  }

  // --- アレンジメモ ---
  view.appendChild(el('div', 'sec-lb', 'アレンジメモ'));
  if (locked) {
    view.appendChild(el('div', day.arrangeMemo ? 'dv-ing' : 'dv-empty', day.arrangeMemo || '—'));
  } else {
    const memoInput = document.createElement('input');
    memoInput.type = 'text';
    memoInput.className = 'dv-line-input';
    memoInput.placeholder = '例：キャベツ残りを追加で入れる…';
    memoInput.value = day.arrangeMemo || '';
    memoInput.addEventListener('blur', () => {
      const d = touchDay(date);
      if (d.arrangeMemo !== memoInput.value.trim()) {
        d.arrangeMemo = memoInput.value.trim();
        saveDays();
      }
    });
    memoInput.addEventListener('keydown', e => { if (e.key === 'Enter') memoInput.blur(); });
    view.appendChild(memoInput);
    const send = el('button', 'memo-send', '→ このメモをNotionメモに送る');
    send.addEventListener('click', () => {
      memoInput.blur();
      const text = memoInput.value.trim();
      if (!text) return;
      memos.push({
        text: (day.main ? '【' + day.main.name + '】' : '') + text,
        date: todayISO(), done: false
      });
      saveMemos();
      renderCounts();
      send.textContent = '✓ 送りました';
      setTimeout(() => { send.textContent = '→ このメモをNotionメモに送る'; }, 1500);
    });
    view.appendChild(send);
  }

  // --- 朝食 ---
  view.appendChild(el('div', 'sec-lb', '朝食'));
  const bfWrap = el('div', 'dv-bf');
  if (locked) {
    bfWrap.appendChild(el('span', 'dv-ing', day.breakfast || '—'));
  } else {
    const sel = document.createElement('select');
    const none = el('option', null, '—');
    none.value = '';
    sel.appendChild(none);
    breakfastPatterns.forEach(p => {
      const o = el('option', null, p.name);
      o.value = p.name;
      if (day.breakfast === p.name) o.selected = true;
      sel.appendChild(o);
    });
    if (day.breakfast && !breakfastPatterns.some(p => p.name === day.breakfast)) {
      const o = el('option', null, day.breakfast);
      o.value = day.breakfast;
      o.selected = true;
      sel.appendChild(o);
    }
    sel.addEventListener('change', () => {
      touchDay(date).breakfast = sel.value || null;
      saveDays();
    });
    bfWrap.appendChild(sel);
  }
  view.appendChild(bfWrap);

  if (locked) view.appendChild(el('div', 'dv-done-note', '確定済みの日です。直すときは「編集に戻す」をタップ。'));
}

function setMain(date, name) {
  const d = touchDay(date);
  const rec = findRecipe(name);
  d.main = rec ? mainSnapshot(rec) : {
    name, category: '', ingredients: '', keyIngredients: extractKeyIngredients(name),
    book: '', page: '', hotcookKey: ''
  };
  // 副菜・汁物が未入力なら、合う副菜・実績からよく使うものを自動セット
  if (!d.sides.some(s => s.name)) {
    const sugg = sideSuggestions(name, '').filter(s => !s.plain);
    const auto = [];
    const side = sugg.find(s => s.role === '副菜');
    const soup = sugg.find(s => s.role === '汁物');
    if (side) auto.push({ role: '副菜', name: side.name });
    if (soup) auto.push({ role: '汁物', name: soup.name });
    if (auto.length) d.sides = auto;
  }
  saveDays();
  resetPanelState(false);
  renderAll();
}

/** インクリメンタル検索つき入力欄。候補タップか確定でcommit(name)を呼ぶ */
function buildCombo(opts) {
  const wrap = el('div', 'combo');
  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = opts.placeholder || '';
  input.value = opts.value || '';
  const dd = el('div', 'combo-dd');
  let committing = false;   // 候補タップ中はblur側のcommitを抑止（二重commit防止）

  const fill = () => {
    const items = opts.suggest(input.value.trim());
    dd.innerHTML = '';
    if (!items.length) { dd.classList.remove('open'); return; }
    items.forEach(it => {
      const row = el('div', 'combo-it');
      row.appendChild(el('span', null, it.name));
      if (it.badge) row.appendChild(el('span', 'bdg' + (it.plain ? ' plain' : ''), it.badge));
      row.addEventListener('pointerdown', e => {
        e.preventDefault();
        input.value = it.name;
        dd.classList.remove('open');
        committing = true;
        input.blur();
        committing = false;
        opts.commit(it.name, it);
      });
      dd.appendChild(row);
    });
    dd.classList.add('open');
  };

  input.addEventListener('focus', fill);
  input.addEventListener('input', fill);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') input.blur(); });
  input.addEventListener('blur', () => {
    setTimeout(() => dd.classList.remove('open'), 150);
    if (!committing) opts.commit(input.value.trim());
  });

  wrap.appendChild(input);
  wrap.appendChild(dd);
  return wrap;
}

/* ============================================================
   CANDIDATES PANEL
   ============================================================ */

function renderPanel() {
  const panel = document.getElementById('cand-panel');
  panel.innerHTML = '';
  const date = selectedDate;
  const day = getDay(date);

  if (!recipes.length) {
    panel.appendChild(el('div', 'cp-empty', '設定からレシピCSVを読み込んでください'));
    return;
  }
  if (day.confirmed) {
    panel.appendChild(el('div', 'cp-empty', 'この日は確定済みです'));
    return;
  }

  const showMain = panelShowsMain;

  const head = el('div', 'cp-head');
  if (showMain) {
    head.appendChild(el('span', 'cp-title', '主菜の候補'));
    head.appendChild(el('span', 'cp-sub', ruleLabel(ruleForDate(date)) + 'から'));
    const sw = el('button', 'cp-switch', day.main ? '副菜候補へ' : '副菜から選ぶ');
    sw.addEventListener('click', () => {
      resetPanelState(false); renderPanel();
    });
    head.appendChild(sw);
  } else {
    head.appendChild(el('span', 'cp-title', '副菜・汁物の候補'));
    head.appendChild(el('span', 'cp-sub', day.main ? day.main.name + 'に' : '主菜はあとで'));
    const sw = el('button', 'cp-switch', '主菜候補へ');
    sw.addEventListener('click', () => { resetPanelState(true); renderPanel(); });
    head.appendChild(sw);
  }
  panel.appendChild(head);

  const listWrap = el('div');
  panel.appendChild(listWrap);

  if (showMain) renderMainCands(listWrap, date);
  else renderSideCands(listWrap, date);
}

function renderMainCands(wrap, date) {
  wrap.innerHTML = '';
  const all = mainCandidates(date);

  if (!all.length) {
    wrap.appendChild(el('div', 'cp-empty', 'この条件の主菜がありません。曜日チップを「すべて」にすると全主菜から選べます。'));
    return;
  }

  if (!panelShowAll) {
    all.slice(0, 5).forEach(c => wrap.appendChild(buildCandCard(c, date)));
    if (all.length > 5) {
      const more = el('button', 'cp-more', 'すべて見る（' + all.length + '件）');
      more.addEventListener('click', () => { panelShowAll = true; panelQuery = ''; renderPanel(); });
      wrap.appendChild(more);
    }
  } else {
    const search = document.createElement('input');
    search.type = 'text';
    search.className = 'cp-search';
    search.placeholder = '名前・食材で検索…';
    search.value = panelQuery;
    const listDiv = el('div');
    const renderList = () => {
      listDiv.innerHTML = '';
      const q = panelQuery.trim();
      const hits = all.filter(c => !q || c.rec.name.includes(q) || c.rec.ingredients.includes(q));
      hits.forEach(c => {
        const row = el('button', 'cl');
        row.appendChild(el('span', 'n', c.rec.name));
        const posWhy = c.why.filter(w => !w.neg);
        const negWhy = c.why.filter(w => w.neg);
        if (posWhy.length) row.appendChild(el('span', 'w', posWhy.map(w => w.text).join('・')));
        else if (negWhy.length) row.appendChild(el('span', 'w plain', negWhy.map(w => w.text).join('・')));
        else row.appendChild(el('span', 'w plain', c.rec.category));
        row.addEventListener('click', () => setMain(date, c.rec.name));
        listDiv.appendChild(row);
      });
      if (!hits.length) listDiv.appendChild(el('div', 'cp-empty', '見つかりません（そのまま左の入力欄に自由入力もできます）'));
    };
    search.addEventListener('input', () => { panelQuery = search.value; renderList(); });
    const back = el('button', 'cp-more', '← 候補5件に戻る');
    back.addEventListener('click', () => { panelShowAll = false; renderPanel(); });
    wrap.appendChild(back);
    wrap.appendChild(search);
    wrap.appendChild(listDiv);
    renderList();
  }
}

function buildCandCard(c, date) {
  const card = el('div', 'cd');
  card.addEventListener('click', () => setMain(date, c.rec.name));

  const top = el('div', 'cd-top');
  top.appendChild(el('span', 'cd-name', c.rec.name));
  top.appendChild(el('span', 'cd-cat', c.rec.category));
  const skip = el('button', 'cd-skip', '外す');
  skip.addEventListener('click', e => {
    e.stopPropagation();
    if (!excluded[date]) excluded[date] = new Set();
    excluded[date].add(c.rec.name);
    renderPanel();
  });
  top.appendChild(skip);
  card.appendChild(top);

  if (c.why.length) {
    const why = el('div', 'cd-why');
    c.why.forEach((w, i) => {
      if (i) why.appendChild(document.createTextNode('・'));
      why.appendChild(el('span', w.neg ? 'neg' : null, w.text));
    });
    card.appendChild(why);
  }
  if (c.rec.ingredients) card.appendChild(el('div', 'cd-ing', c.rec.ingredients));
  if (c.rec.book) {
    card.appendChild(el('div', 'dv-ref',
      c.rec.book + (c.rec.page ? ' p.' + c.rec.page : '')));
  }
  return card;
}

/** 副菜候補タップ時の共通処理：同役割の空スロットがあれば埋め、無ければ追加 */
function pickSideCandidate(date, role, name) {
  const d = touchDay(date);
  const empty = d.sides.find(s => s.role === role && !s.name);
  if (empty) empty.name = name;
  else d.sides.push({ role, name });
  saveDays();
  renderStrip();
  renderDay();
  renderPanel();
}

function renderSideCands(wrap, date) {
  wrap.innerHTML = '';

  const tabs = el('div', 'cp-tabs');
  ['副菜', '汁物'].forEach(role => {
    const btn = el('button', 'cp-tab' + (panelSideRole === role ? ' sel' : ''), role);
    btn.addEventListener('click', () => {
      if (panelSideRole === role) return;
      panelSideRole = role;
      panelShowAll = false;
      panelQuery = '';
      renderPanel();
    });
    tabs.appendChild(btn);
  });
  wrap.appendChild(tabs);

  const all = sideCandidates(date, panelSideRole);

  if (!all.length) {
    wrap.appendChild(el('div', 'cp-empty', 'この役割の候補がありません。左の欄に自由入力できます。'));
    return;
  }

  if (!panelShowAll) {
    all.slice(0, 5).forEach(c => wrap.appendChild(buildSideCandCard(c, date)));
    if (all.length > 5) {
      const more = el('button', 'cp-more', 'すべて見る（' + all.length + '件）');
      more.addEventListener('click', () => { panelShowAll = true; panelQuery = ''; renderPanel(); });
      wrap.appendChild(more);
    }
  } else {
    const search = document.createElement('input');
    search.type = 'text';
    search.className = 'cp-search';
    search.placeholder = '名前・食材で検索…';
    search.value = panelQuery;
    const listDiv = el('div');
    const renderList = () => {
      listDiv.innerHTML = '';
      const q = panelQuery.trim();
      const hits = all.filter(c => !q || c.name.includes(q) || (c.rec && c.rec.ingredients.includes(q)));
      hits.forEach(c => {
        const row = el('button', 'cl');
        row.appendChild(el('span', 'n', c.name));
        if (c.why.length) row.appendChild(el('span', 'w', c.why.map(w => w.text).join('・')));
        else row.appendChild(el('span', 'w plain', c.role));
        row.addEventListener('click', () => pickSideCandidate(date, panelSideRole, c.name));
        listDiv.appendChild(row);
      });
      if (!hits.length) listDiv.appendChild(el('div', 'cp-empty', '見つかりません（そのまま左の入力欄に自由入力もできます）'));
    };
    search.addEventListener('input', () => { panelQuery = search.value; renderList(); });
    const back = el('button', 'cp-more', '← 候補5件に戻る');
    back.addEventListener('click', () => { panelShowAll = false; renderPanel(); });
    wrap.appendChild(back);
    wrap.appendChild(search);
    wrap.appendChild(listDiv);
    renderList();
  }
}

function buildSideCandCard(c, date) {
  const card = el('div', 'cd');
  card.addEventListener('click', () => pickSideCandidate(date, c.role, c.name));

  const top = el('div', 'cd-top');
  top.appendChild(el('span', 'cd-name', c.name));
  top.appendChild(el('span', 'cd-cat', c.role));
  card.appendChild(top);

  if (c.why.length) {
    const why = el('div', 'cd-why');
    c.why.forEach((w, i) => {
      if (i) why.appendChild(document.createTextNode('・'));
      why.appendChild(el('span', w.neg ? 'neg' : null, w.text));
    });
    card.appendChild(why);
  }
  if (c.rec && c.rec.ingredients) card.appendChild(el('div', 'cd-ing', c.rec.ingredients));
  if (c.rec && c.rec.book) {
    card.appendChild(el('div', 'dv-ref',
      c.rec.book + (c.rec.page ? ' p.' + c.rec.page : '')));
  }
  return card;
}

/* ============================================================
   PANTRY BAR — 常設。チップタップで まるごと⇄残りあり 切替
   ============================================================ */

function bumpPanHist(name) {
  const cur = panHist[name] || { n: 0, last: '' };
  panHist[name] = { n: cur.n + 1, last: todayISO() };
  const keys = Object.keys(panHist);
  if (keys.length > 40) {
    keys.sort((a, b) => panHist[b].n - panHist[a].n || (panHist[b].last > panHist[a].last ? 1 : -1));
    keys.slice(30).forEach(k => delete panHist[k]);
  }
  Storage.set('panHist', panHist);
}

/** よく使う食材の呼び出し候補（在庫に入っているものは除く） */
function pantrySuggestions(limit) {
  const inPantry = new Set(pantry.map(p => p.name));
  return Object.entries(panHist)
    .filter(([name]) => !inPantry.has(name))
    .sort((a, b) => b[1].n - a[1].n || (b[1].last > a[1].last ? 1 : -1))
    .slice(0, limit || 6)
    .map(([name]) => name);
}

function addPantryItem(name) {
  pantry.push({ name, state: 'whole', added: todayISO() });
  bumpPanHist(name);
  savePantry();
  renderPantryBar();
  renderPanel();
  renderDay();
}

function renderPantryBar() {
  const sugg = document.getElementById('pantry-sugg');
  sugg.innerHTML = '';
  pantrySuggestions(6).forEach(name => {
    const ghost = el('button', 'pan-ghost', '＋' + name);
    ghost.addEventListener('click', () => addPantryItem(name));
    sugg.appendChild(ghost);
  });
  const wrap = document.getElementById('pantry-chips');
  wrap.innerHTML = '';
  pantry.forEach((item, idx) => {
    const chip = el('span', 'pan-chip' + (item.state === 'partial' ? ' partial' : ''));
    chip.title = 'タップで まるごと⇄残りあり';
    chip.appendChild(el('span', null,
      item.name + (item.state === 'partial' ? '・残りあり' : '')));
    chip.addEventListener('click', () => {
      item.state = item.state === 'partial' ? 'whole' : 'partial';
      savePantry();
      renderPantryBar();
      renderPanel();
      renderDay();
    });
    const x = el('button', 'px', '✕');
    x.addEventListener('click', e => {
      e.stopPropagation();
      pantry.splice(idx, 1);
      savePantry();
      renderPantryBar();
      renderPanel();
      renderDay();
    });
    chip.appendChild(x);
    wrap.appendChild(chip);
  });
}

function addPantryInline() {
  const input = document.getElementById('pantry-inline');
  const name = input.value.trim();
  if (!name) return;
  input.value = '';
  addPantryItem(name);
}

/* ============================================================
   NOTION MEMOS
   ============================================================ */

let mmEditing = null;   // 編集モードで開いているメモのindex

function renderMemos() {
  const list = document.getElementById('memo-list');
  list.innerHTML = '';
  if (!memos.length) list.appendChild(el('div', 'cp-empty', 'Notionに後で反映したいことをためておけます'));
  memos.forEach((m, idx) => {
    const row = el('div', 'mm-row');
    const chk = el('button', 'mm-chk', m.done ? '✓' : '');
    chk.addEventListener('click', () => {
      m.done = !m.done;
      saveMemos();
      renderMemos();
    });
    row.appendChild(chk);
    const body = el('div', 'mm-body');
    if (mmEditing === idx) {
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.className = 'mm-edit';
      inp.value = m.text;
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') inp.blur(); });
      let committed = false;
      const commit = () => {
        if (committed) return;
        committed = true;
        const t = inp.value.trim();
        if (t && t !== m.text) { m.text = t; saveMemos(); }
        mmEditing = null;
      };
      inp.addEventListener('blur', () => {
        commit();
        // タップ先のボタン(click)が先に処理できるよう、combo同様150ms遅らせて再描画
        setTimeout(() => { if (mmEditing === null) renderMemos(); }, 150);
      });
      body.appendChild(inp);
      body.appendChild(el('div', 'mm-meta', m.date));
      row.appendChild(body);
      const editX = el('button', 'mm-x', '✕');
      editX.addEventListener('click', () => {
        memos.splice(idx, 1);
        saveMemos();
        renderMemos();
      });
      row.appendChild(editX);
      list.appendChild(row);
      inp.focus();
    } else {
      const txt = el('div', 'mm-text' + (m.done ? ' done' : ''), m.text);
      txt.addEventListener('click', () => { mmEditing = idx; renderMemos(); });
      body.appendChild(txt);
      body.appendChild(el('div', 'mm-meta', m.date + '　タップで編集'));
      row.appendChild(body);
      const x = el('button', 'mm-x', '✕');
      x.addEventListener('click', () => {
        memos.splice(idx, 1);
        saveMemos();
        renderMemos();
      });
      row.appendChild(x);
      list.appendChild(row);
    }
  });
  renderCounts();
}

function addMemo() {
  const input = document.getElementById('memo-input');
  const text = input.value.trim();
  if (!text) return;
  memos.push({ text, date: todayISO(), done: false });
  input.value = '';
  saveMemos();
  renderMemos();
}

function promptMemo(recipeName) {
  const text = prompt('Notionメモ（' + recipeName + '）');
  if (!text || !text.trim()) return;
  memos.push({ text: '【' + recipeName + '】' + text.trim(), date: todayISO(), done: false });
  saveMemos();
  renderCounts();
}

function copyMemos() {
  const lines = memos.filter(m => !m.done).map(m => '- ' + m.text + '（' + m.date + '）');
  if (!lines.length) { alert('未処理のメモはありません'); return; }
  const text = lines.join('\n');
  const done = () => alert('コピーしました（' + lines.length + '件）');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'absolute';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); } catch { alert('コピーできませんでした'); }
  document.body.removeChild(ta);
}

/* ============================================================
   SETTINGS
   ============================================================ */

function renderRules() {
  const grid = document.getElementById('rules-grid');
  const rules = getRules();
  grid.innerHTML = '';
  ['月', '火', '水', '木', '金', '土', '日'].forEach(dayName => {
    const rule = rules[dayName] || DEFAULT_RULES[dayName];
    grid.appendChild(el('span', 'rl', dayName));
    const wrap = el('div', 'dv-rule-wrap');
    const chip = el('span', 'dv-rule-chip', ruleLabel(rule));
    chip.style.background = ruleChipColor(rule);
    wrap.appendChild(chip);
    const select = document.createElement('select');
    RULE_OPTIONS.forEach(opt => {
      const o = el('option', null, opt.label);
      o.value = JSON.stringify({ type: opt.type, value: opt.value });
      if (opt.type === rule.type && opt.value === rule.value) o.selected = true;
      select.appendChild(o);
    });
    select.addEventListener('change', () => {
      const all = getRules();
      all[dayName] = JSON.parse(select.value);
      Storage.set('rules', all);
      renderRules();
      renderDay();
      renderPanel();
    });
    wrap.appendChild(select);
    grid.appendChild(wrap);
  });
}

function resetRules() {
  Storage.set('rules', { ...DEFAULT_RULES });
  renderRules();
  renderDay();
  renderPanel();
}

let bpEditing = null;        // 編集モードで開いている行のindex
let bpFocusPending = false;  // タップ直後の1回だけフォーカスを当てる

function autoGrow(ta) {
  ta.style.height = 'auto';
  ta.style.height = ta.scrollHeight + 'px';
}

function bpTextarea(cls, placeholder, value) {
  const ta = document.createElement('textarea');
  ta.className = cls;
  ta.rows = 1;
  ta.placeholder = placeholder;
  ta.value = value || '';
  ta.addEventListener('input', () => autoGrow(ta));
  ta.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); ta.blur(); } });
  return ta;
}

function renderBreakfastPatterns() {
  const list = document.getElementById('bp-list');
  list.innerHTML = '';
  breakfastPatterns.forEach((pattern, idx) => {
    const item = el('div', 'bp-item');
    if (bpEditing === idx) {
      const wrap = el('div', 'bp-edit');
      const nameTa = bpTextarea('b-n', 'メニュー名…', pattern.name);
      nameTa.addEventListener('blur', () => updateBreakfastPattern(idx, 'name', nameTa.value));
      wrap.appendChild(nameTa);
      const ingTa = bpTextarea('b-i', '材料（任意）…', pattern.ingredients);
      ingTa.addEventListener('blur', () => updateBreakfastPattern(idx, 'ingredients', ingTa.value));
      wrap.appendChild(ingTa);
      const done = el('button', 'bp-done', '完了');
      done.addEventListener('click', () => { bpEditing = null; renderBreakfastPatterns(); });
      wrap.appendChild(done);
      item.appendChild(wrap);
      list.appendChild(item);
      autoGrow(nameTa);
      autoGrow(ingTa);
      if (bpFocusPending) { bpFocusPending = false; nameTa.focus(); }
    } else {
      const row = el('div', 'bp-view');
      const text = el('div', 'bp-view-text');
      text.appendChild(el('div', 'bp-view-name', pattern.name));
      if (pattern.ingredients) text.appendChild(el('div', 'bp-view-ing', pattern.ingredients));
      row.appendChild(text);
      const x = el('button', 'bp-x', '✕');
      x.addEventListener('click', e => {
        e.stopPropagation();
        breakfastPatterns.splice(idx, 1);
        if (bpEditing !== null && bpEditing > idx) bpEditing--;
        Storage.set('bpats', breakfastPatterns);
        renderBreakfastPatterns();
        renderDay();
      });
      row.appendChild(x);
      row.addEventListener('click', () => {
        bpEditing = idx;
        bpFocusPending = true;
        renderBreakfastPatterns();
      });
      item.appendChild(row);
      list.appendChild(item);
    }
  });
}

function updateBreakfastPattern(idx, field, value) {
  const trimmed = value.trim();
  if (field === 'name' && !trimmed) { renderBreakfastPatterns(); return; }
  const oldName = breakfastPatterns[idx].name;
  if (breakfastPatterns[idx][field] === trimmed) return;
  breakfastPatterns[idx][field] = trimmed;
  if (field === 'name' && oldName !== trimmed) {
    for (const day of Object.values(days)) {
      if (day.breakfast === oldName) day.breakfast = trimmed;
    }
    saveDays();
  }
  Storage.set('bpats', breakfastPatterns);
  renderDay();
}

function addBreakfastPattern() {
  const nameInput = document.getElementById('bp-name-input');
  const ingInput = document.getElementById('bp-ing-input');
  const name = nameInput.value.trim();
  if (!name) return;
  breakfastPatterns.push({ name, ingredients: ingInput.value.trim() });
  nameInput.value = '';
  ingInput.value = '';
  nameInput.style.height = '';
  ingInput.style.height = '';
  Storage.set('bpats', breakfastPatterns);
  renderBreakfastPatterns();
  renderDay();
}

/* ----- CSV ----- */

document.getElementById('csv-file').addEventListener('change', e => {
  if (e.target.files.length) loadCSV(e.target.files[0]);
  e.target.value = '';
});

function loadCSV(file) {
  if (file.size > 5 * 1024 * 1024) {
    alert('ファイルサイズが大きすぎます（上限5MB）');
    return;
  }
  const reader = new FileReader();
  reader.onload = e => {
    const parsed = parseCSV(e.target.result);
    const loaded = csvToRecipes(parsed);
    if (!loaded.length) { alert('レシピを読み込めませんでした'); return; }
    recipes = loaded;
    Storage.set('recipes', recipes);
    updateCSVStatus();
    renderAll();
  };
  reader.readAsText(file, 'UTF-8');
}

function updateCSVStatus() {
  const drop = document.getElementById('csv-drop');
  const loaded = document.getElementById('csv-loaded');
  if (!recipes.length) {
    drop.style.display = '';
    loaded.style.display = 'none';
    return;
  }
  drop.style.display = 'none';
  loaded.style.display = '';
  const counts = {};
  recipes.forEach(r => { counts[r.role] = (counts[r.role] || 0) + 1; });
  document.getElementById('csv-status').textContent = 'レシピ ' + recipes.length + '件（' +
    Object.entries(counts).map(([k, v]) => k + ' ' + v).join('　') + '）';
}

/* ----- Backup ----- */

function exportBackup() {
  const data = {
    _type: 'meal_planner_v2_backup',
    _schemaVersion: 1,
    _exported: new Date().toISOString(),
    recipes, days, pantry, panHist, memos,
    breakfastPatterns,
    rules: getRules()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'meal_planner_' + todayISO().replace(/-/g, '') + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

document.getElementById('backup-file').addEventListener('change', function(e) {
  if (!e.target.files.length) return;
  const file = e.target.files[0];
  if (file.size > 10 * 1024 * 1024) {
    alert('ファイルサイズが大きすぎます');
    e.target.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const data = JSON.parse(ev.target.result);
      if (data._type !== 'meal_planner_v2_backup') {
        alert('このアプリのバックアップファイルではありません');
        return;
      }
      if (!confirm('現在のデータをすべて置き換えます。よろしいですか？')) return;
      if (Array.isArray(data.recipes)) {
        recipes = data.recipes;
        normalizeRecipes(recipes);
        Storage.set('recipes', recipes);
      }
      if (data.days && typeof data.days === 'object' && !Array.isArray(data.days)) { days = data.days; saveDays(); }
      if (Array.isArray(data.pantry)) { pantry = data.pantry; savePantry(); }
      if (data.panHist && typeof data.panHist === 'object' && !Array.isArray(data.panHist)) {
        panHist = data.panHist;
        Storage.set('panHist', panHist);
      }
      if (Array.isArray(data.memos)) { memos = data.memos; saveMemos(); }
      if (Array.isArray(data.breakfastPatterns)) {
        breakfastPatterns = data.breakfastPatterns.filter(p => p && typeof p.name === 'string');
        Storage.set('bpats', breakfastPatterns);
      }
      if (data.rules && typeof data.rules === 'object' && !Array.isArray(data.rules)) {
        Storage.set('rules', data.rules);
      }
      updateCSVStatus();
      renderRules();
      renderBreakfastPatterns();
      renderMemos();
      resetPanelState(!getDay(selectedDate).main);
      renderAll();
      alert('読み込みました');
    } catch {
      alert('ファイルの読み込みに失敗しました');
    }
  };
  reader.readAsText(file, 'UTF-8');
  e.target.value = '';
});

/* ============================================================
   MODALS
   ============================================================ */

function openModal(name) {
  if (name === 'memo') { mmEditing = null; renderMemos(); }
  if (name === 'settings') { updateCSVStatus(); renderRules(); bpEditing = null; renderBreakfastPatterns(); }
  document.getElementById('ov-' + name).classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(e, name) {
  if (e && e.target !== document.getElementById('ov-' + name)) return;
  document.getElementById('ov-' + name).classList.remove('open');
  document.body.style.overflow = '';
  renderAll();
}

/* ============================================================
   RENDER ALL / INIT
   ============================================================ */

function renderCounts() {
  const open = memos.filter(m => !m.done).length;
  document.getElementById('memo-count').textContent = open ? String(open) : '';
}

function renderAll() {
  renderStrip();
  renderPantryBar();
  renderDay();
  renderPanel();
  renderCounts();
}

/** 保存済み/読み込んだレシピ配列を正規化する（起動時修復とバックアップ読み込みの両方から呼ぶ）。
 *  - 旧バージョンが括弧内で誤分割したまま保存したpairings等を繋ぎ直す
 *  - 配列であるべきフィールドが配列でなければ空配列に補正する（壊れたJSON対策）
 *  - substitutes（代用食材）が無い旧データには空配列を補う
 *  戻り値: 変更があったかどうか（呼び出し側でStorage.setするかの判断に使う） */
function normalizeRecipes(list) {
  let changed = false;
  list.forEach(r => {
    ['pairings', 'keyIngredients', 'tags', 'substitutes'].forEach(k => {
      if (!Array.isArray(r[k])) {
        r[k] = [];
        changed = true;
      } else if (k !== 'substitutes') {
        const fixed = repairSplitList(r[k]);
        if (fixed.length !== r[k].length) { r[k] = fixed; changed = true; }
      }
    });
  });
  return changed;
}

/* 旧バージョンで誤分割されたまま保存されたレシピデータを起動時に修復する */
(function repairStoredRecipes() {
  if (normalizeRecipes(recipes)) Storage.set('recipes', recipes);
})();

renderAll();

if (LS._memory) {
  const note = el('div', null, '※ プレビュー環境のため、データはリロードすると消えます');
  note.style.cssText = 'padding:2px 24px;font-size:11px;color:#9AA1A9;';
  document.body.insertBefore(note, document.body.firstChild);
}
